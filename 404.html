<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı — Kizuna</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" href="kizuna-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px}
.container{max-width:520px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(48px,10vw,80px);font-weight:300;color:#C4A265;line-height:1;margin-bottom:16px}
p{font-size:15px;color:rgba(255,255,255,0.5);line-height:1.8;margin-bottom:32px}
a.btn{display:inline-block;background:#C4A265;color:#0d0d0d;padding:13px 26px;border-radius:4px;font-size:13px;font-weight:500;letter-spacing:0.04em;text-decoration:none;transition:background 0.2s,transform 0.2s}
a.btn:hover{background:#D4B87A;transform:translateY(-2px)}
.sub-links{margin-top:24px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.sub-links a{font-size:13px;color:rgba(255,255,255,0.4);text-decoration:none;transition:color 0.2s}
.sub-links a:hover{color:#C4A265}

/* motion-polish v1 */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1)}
/* Fix 5: strong ease-out on primary interactive elements */
.btn-primary,.btn-outline,.btn-on-accent,.btn-submit,.nav-cta-btn,.btn,.svc-card,.client-card,.blog-card,.process-card,.value-card,.who-card,.content-card{transition-timing-function:var(--ease-out)}
/* Fix 3: press feedback */
.btn-primary:active,.btn-outline:active,.btn-on-accent:active,.btn-submit:active,.nav-cta-btn:active,.btn:active,button[type=submit]:active,.chip label:active,.theme-toggle:active,.lang-btn:active,.mobile-menu a:active{transform:scale(0.97);transition:transform 0.14s var(--ease-out)}
/* Fix 2: neutralize sticky hover/zoom on touch devices */
@media (hover:none){
.blog-card:hover,.btn-on-accent:hover,.btn-outline:hover,.btn-primary:hover,.btn-submit:hover,.btn:hover,.client-card:hover,.content-card:hover,.highlight:hover,.nav-cta-btn:hover,.process-card:hover,.sector:hover,.svc-card:hover,.value-card:hover,.who-card:hover,.dest-card:hover,.dest-item:hover,.other-dest-card:hover,.other-svc-card:hover{transform:none;box-shadow:none}
.blog-card:hover .blog-card-img img,.dest-card:hover img,.dest-item:hover img,.hero-svc-card:hover img,.other-dest-card:hover img,.other-svc-card:hover img,.svc-link:hover img{transform:none}
}
/* Fix 1: respect reduced-motion preference */
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="container">
<h1>404</h1>
<p>Aradığınız sayfa bulunamadı veya taşınmış olabilir. Japonya yolculuğunuzda size yardımcı olalım.</p>
<a href="/" class="btn">Ana Sayfaya Dön</a>
<div class="sub-links">
<a href="/travel.html">Japonya Seyahat</a>
<a href="/services.html">Hizmetler</a>
<a href="/ozel-tur-talebi.html">Özel Tur Talebi</a>
<a href="/blog.html">Blog</a>
<a href="/contact.html">İletişim</a>
</div>
</div>
</body>
</html>
